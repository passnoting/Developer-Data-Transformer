<rect x="24" y="78" width="232" height="66" rx="10" fill="#EEF4FF" stroke="#C7D7FB" stroke-width="1.6"/>
<text x="36" y="102" font-size="13" font-weight="700" fill="#1E3A8A">免费工具页</text>
<text x="36" y="121" font-size="10" fill="#5A6675">Astro 静态 · /tools/*</text>
<text x="36" y="135" font-size="10" fill="#5A6675">SEO 长尾入口，文件不上传</text>
<rect x="24" y="160" width="232" height="66" rx="10" fill="#EEF4FF" stroke="#C7D7FB" stroke-width="1.6"/>
<text x="36" y="184" font-size="13" font-weight="700" fill="#1E3A8A">应用界面</text>
<text x="36" y="203" font-size="10" fill="#5A6675">管道列表 / 运行日志</text>
<text x="36" y="217" font-size="10" fill="#5A6675">逐格 diff + 撤销</text>
<rect x="24" y="242" width="232" height="66" rx="10" fill="#EEF4FF" stroke="#C7D7FB" stroke-width="1.6"/>
<text x="36" y="266" font-size="13" font-weight="700" fill="#1E3A8A">浏览器清洗引擎</text>
<text x="36" y="285" font-size="10" fill="#5A6675">同一份 core，跑在 WASM</text>
<text x="36" y="299" font-size="10" fill="#5A6675">5MB 内免费不限次</text>
<rect x="24" y="324" width="232" height="66" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.6"/>
<text x="36" y="348" font-size="13" font-weight="700" fill="#334155">Chrome 扩展（可选）</text>
<text x="36" y="367" font-size="10" fill="#5A6675">从当前页面抓表</text>
<text x="36" y="381" font-size="10" fill="#5A6675">只做漏斗，不做收银台</text>
<rect x="330" y="78" width="250" height="66" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.6"/>
<text x="342" y="102" font-size="13" font-weight="700" fill="#065F46">API 路由 /api/*</text>
<text x="342" y="121" font-size="10" fill="#5A6675">Bearer 鉴权 · CORS</text>
<text x="342" y="135" font-size="10" fill="#5A6675">建管道 / 手动跑 / 查运行</text>
<rect x="330" y="160" width="250" height="60" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.6"/>
<text x="342" y="184" font-size="13" font-weight="700" fill="#065F46">Cron 调度器</text>
<text x="342" y="203" font-size="10" fill="#5A6675">每日 06:00 / 每小时（Pro）</text>
<rect x="330" y="236" width="250" height="92" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.6"/>
<text x="342" y="260" font-size="13" font-weight="700" fill="#065F46">管道执行器</text>
<text x="342" y="279" font-size="10" fill="#5A6675">fetch → transform → validate</text>
<text x="342" y="293" font-size="10" fill="#5A6675">→ snapshot → alert</text>
<text x="342" y="307" font-size="10" fill="#5A6675">失败/异常都留日志</text>
<rect x="330" y="344" width="250" height="60" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.6"/>
<text x="342" y="368" font-size="13" font-weight="700" fill="#065F46">告警器</text>
<text x="342" y="387" font-size="10" fill="#5A6675">行数 ±20% / 运行失败</text>
<rect x="330" y="420" width="250" height="60" rx="10" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.6"/>
<text x="342" y="444" font-size="13" font-weight="700" fill="#9D174D">计费 webhook</text>
<text x="342" y="463" font-size="10" fill="#5A6675">Creem 验签 → 订阅状态</text>
<rect x="664" y="78" width="226" height="92" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.6"/>
<text x="676" y="102" font-size="13" font-weight="700" fill="#9A3412">D1 元数据</text>
<text x="676" y="121" font-size="10" fill="#5A6675">workspace / pipeline / rules</text>
<text x="676" y="135" font-size="10" fill="#5A6675">runs / subscriptions</text>
<text x="676" y="149" font-size="10" fill="#5A6675">不存原始数据</text>
<rect x="664" y="186" width="226" height="66" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.6"/>
<text x="676" y="210" font-size="13" font-weight="700" fill="#9A3412">R2 快照</text>
<text x="676" y="229" font-size="10" fill="#5A6675">最新一次结果 + meta</text>
<text x="676" y="243" font-size="10" fill="#5A6675">7 天自动过期</text>
<rect x="664" y="268" width="226" height="66" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.6"/>
<text x="676" y="292" font-size="13" font-weight="700" fill="#9A3412">托管表页 /t/:token</text>
<text x="676" y="311" font-size="10" fill="#5A6675">只读页面 + CSV 下载</text>
<rect x="940" y="78" width="268" height="92" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.6"/>
<text x="952" y="102" font-size="13" font-weight="700" fill="#5B21B6">数据源 API</text>
<text x="952" y="121" font-size="10" fill="#5A6675">任意 REST / JSON（分页 / 鉴权）</text>
<text x="952" y="135" font-size="10" fill="#5A6675">Shopify · Stripe 预置</text>
<rect x="940" y="186" width="268" height="60" rx="10" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.6"/>
<text x="952" y="210" font-size="13" font-weight="700" fill="#9D174D">Creem（MoR）</text>
<text x="952" y="229" font-size="10" fill="#5A6675">3.9% + $0.40 · 代缴 VAT</text>
<rect x="940" y="268" width="268" height="66" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.6"/>
<text x="952" y="292" font-size="13" font-weight="700" fill="#5B21B6">客户的表</text>
<text x="952" y="311" font-size="10" fill="#5A6675">Google Sheets / Excel</text>
<text x="952" y="325" font-size="10" fill="#5A6675">IMPORTDATA 或直接下 CSV</text>
<rect x="940" y="344" width="268" height="60" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.6"/>
